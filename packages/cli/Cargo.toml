[package]
name = "proxync-cli"
version = "0.1.0"
edition = "2021"
description = "Proxync CLI companion — Lightweight developer tunneling & reconnaissance from the terminal"
authors = ["Inilax"]

[[bin]]
name = "proxync"
path = "src/main.rs"

[dependencies]
proxync-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "cargo"] }
